{% extends "catalog/base.html" %}

{% block title %}Удаление записи - Блог{% endblock %}

{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'blogs:post_list' %}">Блог</a></li>
        <li class="breadcrumb-item active">Удаление</li>
    </ol>
</nav>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h3 class="mb-0">Подтверждение удаления</h3>
            </div>
            <div class="card-body">
                <p class="fs-5">Вы уверены, что хотите удалить запись <strong>"{{ object.title }}"</strong>?</p>
                <p class="text-muted">Это действие нельзя отменить.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'blogs:post_detail' object.pk %}" class="btn btn-secondary">← Отмена</a>
                        <button type="submit" class="btn btn-danger">Да, удалить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
